<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding page-shell">
    @if (user(); as u) {
      <div class="ion-text-center vb-hero">
        <div class="brand-mark">
          <ion-icon name="person-circle-outline"></ion-icon>
        </div>
        <h1 class="vb-title">{{ u.fullName }}</h1>
        <p class="vb-kicker">{{ u.profileType === 'especialista' ? 'Especialista' : 'Cliente' }}</p>
      </div>

      <ion-list [inset]="true">
        <ion-item>
          <ion-label>
            <p>Correo</p>
            <h2>{{ u.email }}</h2>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <p>Teléfono</p>
            <h2>{{ u.phone }}</h2>
          </ion-label>
        </ion-item>
      </ion-list>

      <ion-button expand="block" color="medium" fill="outline" (click)="salir()">
        Cerrar sesión
      </ion-button>
    }
  </div>
</ion-content>
